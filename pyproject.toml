[project]
name = "dxsew"
version = "0.1.0"
description = "Places, SMART-DS circuits and EULP buildings sewn into a synthetic balancing area"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openpyxl",
    "pandas",
    "pyarrow",
    "pyshp",
    "pyyaml",
    "requests",
    "shapely",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
